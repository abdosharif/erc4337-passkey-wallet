name: ERC-4337 Passkey Wallet CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '02-erc4337-passkey-wallet/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Smart Contracts
        run: npm run compile

      - name: Run Test Suite
        run: npm test

      - name: Build Next.js Application
        run: npm run build:app
